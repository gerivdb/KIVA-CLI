[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiva-cli"
version = "0.1.0"
description = "KIVA CLI - Projects & Applications Orchestrator for Ecosystem-1"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "gerivdb", email = "gerivdb@users.noreply.github.com"}
]
keywords = ["cli", "orchestration", "ecosystem-1", "kiva", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/gerivdb/KIVA-CLI"
Documentation = "https://github.com/gerivdb/KIVA-CLI/blob/main/docs/"
Repository = "https://github.com/gerivdb/KIVA-CLI"
Issues = "https://github.com/gerivdb/KIVA-CLI/issues"

[project.scripts]
kiva = "kiva_cli.kiva:cli"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=kiva_cli --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
