[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=kiva_cli
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (subprocess, filesystem)
    slow: Slow tests (>1s)
