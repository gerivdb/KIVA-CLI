[pytest]
# Pytest configuration for KIVA CLI testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    ternary: Tests involving ternary state validation (PENDING/SUCCESS/FAILED)
    phi_validation: Tests involving φ-CPS impact validation
    integration: Integration tests (slower, may require external resources)
    deployment: Tests involving deployment workflows
    rollback: Tests involving rollback mechanisms
    secrets: Tests involving secrets management
    monitoring: Tests involving monitoring and health checks

# Test output settings
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=kiva_cli
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    -ra

# Coverage settings
[coverage:run]
source = kiva_cli
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Test environment
testpaths = tests

# Asyncio support
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (seconds)
timeout = 30

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
