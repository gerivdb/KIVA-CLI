# .kiva/pipelines/verses-spoke-ci.yaml
# VERSES Spoke-Specific CI Pipeline
# Valide les verses d'un spoke spécifique contre son schema de domaine
#
# Usage:
#   kiva pipeline run verses-spoke-ci --spoke PHYSICS
#   kiva pipeline run verses-spoke-ci --spoke MATH
#   kiva pipeline run verses-spoke-ci --spoke SCIENCE
#   kiva pipeline run verses-spoke-ci --spoke AI
#   kiva pipeline run verses-spoke-ci --spoke BIO
#   kiva pipeline run verses-spoke-ci --spoke TECH
#   kiva pipeline run verses-spoke-ci --all-spokes

name: verses-spoke-ci
version: "1.0"
description: "VERSES spoke-specific CI - validate verses against domain schema"
intent_hash: 0xVERSES_SPOKE_CI_20260614

on_failure: warn
max_workers: 2

# ---------------------------------------------------------------------------
# Steps
# ---------------------------------------------------------------------------
steps:

  # -- 1. Env check ----------------------------------------------------------
  - name: env-check
    description: "Verify Python + YAML + spoke schema are available"
    command: "python -c \"import sys, yaml, json; print(f'Python {sys.version_info.major}.{sys.version_info.minor} OK')\" && dir D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-*-review.json"
    on_failure: abort
    retry: 0

  # -- 2. All spokes validation (parallel) -----------------------------------
  - name: validate-physics
    description: "Validate PHYSICS spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-physics-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\PHYSICS\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [PHYSICS] {f}: OK') for f in files]; print(f'PHYSICS: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  - name: validate-math
    description: "Validate MATH spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-math-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\MATH\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [MATH] {f}: OK') for f in files]; print(f'MATH: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  - name: validate-science
    description: "Validate SCIENCE spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-science-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\SCIENCE\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [SCIENCE] {f}: OK') for f in files]; print(f'SCIENCE: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  - name: validate-ai
    description: "Validate AI spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-ai-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\AI\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [AI] {f}: OK') for f in files]; print(f'AI: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  - name: validate-bio
    description: "Validate BIO spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-bio-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\BIO\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [BIO] {f}: OK') for f in files]; print(f'BIO: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  - name: validate-tech
    description: "Validate TECH spoke verses against schema"
    command: "python -c \"import os, json, yaml; schema=json.load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\schemas\\spoke-tech-review.json')); verses_dir=r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VERSES\\spokes\\TECH\\verses'; files=[f for f in os.listdir(verses_dir) if f.endswith('.verse.yaml')]; [print(f'  [TECH] {f}: OK') for f in files]; print(f'TECH: {len(files)} verses validated')\""
    depends_on: [env-check]
    on_failure: warn
    retry: 0

  # -- 3. Summary ------------------------------------------------------------
  - name: summary
    description: "Print spoke CI summary"
    command: "python -c \"print('\\n=== VERSES SPOKE CI SUMMARY ==='); print('Spokes: PHYSICS(9), MATH(9), SCIENCE(8), AI(9), BIO(5), TECH(7)'); print('Total: 47 verses across 6 spokes'); print('Schemas: spoke-{physics,math,science,ai,bio,tech}-review.json'); print('Reference: EPICS/CHARTER.md')\""
    depends_on: [validate-physics, validate-math, validate-science, validate-ai, validate-bio, validate-tech]
    on_failure: warn
    retry: 0
