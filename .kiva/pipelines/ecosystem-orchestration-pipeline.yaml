name: ecosystem-orchestration-pipeline
version: "1.0.0"
intent_hash: 0xKIVA_ECOSYSTEM_ORCHESTRATION_PIPELINE_20260728
description: |
  CI local ENV2 - Pipeline d'orchestration cross-repo CTULU/TRIX/ECOS-CLI.
  Verifie la cohérence entre les 3 couches N+3 : registry sync, dispatch tables, runtime health, BRIDGES.yaml, WAL integrity.
  Schedule: toutes les 30 min + sur merge vers main (CTULU, TRIX, ECOS-CLI, GOVERNANCE-HUB).
  Refs: ADR-2026-07-28-020, ADR-2026-06-28-001, INTENT-094
  Concepts: cross-repo-orchestration, n3-layer-coherence, bdcp-aware

schedule: "*/30 * * * *"   # Toutes les 30 minutes
on_merge:
  - repo: gerivdb/CTULU
    branch: main
  - repo: gerivdb/TRIX
    branch: main
  - repo: gerivdb/ECOS-CLI
    branch: main
  - repo: gerivdb/GOVERNANCE-HUB
    branch: main

env:
  KIVA_CLI_PATH: "D:/DO/WEB/TOOLS/L1-INFRA/KIVA-CLI"
  CTULU_PATH: "D:/DO/WEB/TOOLS/L4-TOOLS/CTULU"
  TRIX_PATH: "D:/DO/WEB/TOOLS/L4-TOOLS/TRIX"
  ECOS_CLI_PATH: "D:/DO/WEB/TOOLS/L1-INFRA/ECOS-CLI"
  GOVERNANCE_HUB: "D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB"
  TOPOS_REGISTRY: "D:/DO/WEB/TOOLS/L1-INFRA/TOPOS/registry/repos.json"
  ECOS_ROOT: "D:/DO/WEB/TOOLS/ECOS_ROOT.json"
  KNOWN_REPOS: "D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/known_repositories.yaml"
  BRIDGES_YAML: "D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/BRIDGES.yaml"
  OUTPUT_DIR: "D:/DO/WEB/TOOLS/reports/ecosystem-orchestration"
  GATEWAY_HOST: "127.0.0.1"
  GATEWAY_PORT: "18000"

steps:

  # -- GATE-0 : BDCP Awareness ---------------------------------------
  - name: gate-bdcp-awareness
    description: "GATE-0 - Verifier mode BDCP (skip si BDCP actif)"
    command: |
      python -c "
      import urllib.request, json, sys, os
      from pathlib import Path
      try:
          url = f'http://{os.environ.get(\"GATEWAY_HOST\", \"127.0.0.1\")}:{os.environ.get(\"GATEWAY_PORT\", \"18000\")}/clapet/status'
          req = urllib.request.Request(url, method='GET')
          r = urllib.request.urlopen(req, timeout=5)
          status = json.loads(r.read().decode())
          if status.get('status') == 'BDCP':
              print('[SKIP] Mode BDCP actif - pipeline saute (mode protege)')
              output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
              output_dir.mkdir(parents=True, exist_ok=True)
              (output_dir / 'bdcp_skip.flag').write_text('true')
              sys.exit(0)
          print(f'[OK] Mode clapet: {status.get(\"status\", \"unknown\")} - pipeline continue')
          output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / 'bdcp_skip.flag').write_text('false')
      except Exception as e:
          print(f'[WARN] Gateway inaccessible, mode degrade: {e}')
          output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / 'bdcp_skip.flag').write_text('false')
      "
    on_failure: continue
    timeout_sec: 10

  # -- STEP-1 : Verifier registry sync --------------------------------
  - name: verify-registry-sync
    description: "STEP-1 - Verifier sync ECOS_ROOT.json <-> TOPOS/registry <-> known_repos.yaml"
    depends_on: [gate-bdcp-awareness]
    command: |
      python -c "
      import json, sys, os
      from pathlib import Path
      import yaml
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - etape sautee')
          sys.exit(0)
      
      errors = []
      warnings = []
      
      # Charger les 3 sources
      sources = {}
      try:
          with open(os.environ.get('ECOS_ROOT', 'D:/DO/WEB/TOOLS/ECOS_ROOT.json'), 'r') as f:
              sources['ecos_root'] = json.load(f)
      except Exception as e:
          errors.append(f'ECOS_ROOT.json: {e}')
      
      try:
          with open(os.environ.get('TOPOS_REGISTRY', 'D:/DO/WEB/TOOLS/L1-INFRA/TOPOS/registry/repos.json'), 'r') as f:
              sources['topos'] = json.load(f)
      except Exception as e:
          errors.append(f'TOPOS/registry/repos.json: {e}')
      
      try:
          with open(os.environ.get('KNOWN_REPOS', 'D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/known_repositories.yaml'), 'r') as f:
              sources['known_repos'] = yaml.safe_load(f)
      except Exception as e:
          errors.append(f'known_repositories.yaml: {e}')
      
      if errors:
          for e in errors: print(f'[ERROR] {e}')
          sys.exit(1)
      
      # Extraire noms de repos de chaque source
      repos = {}
      if 'ecos_root' in sources and 'repos' in sources['ecos_root']:
          repos['ecos_root'] = {r['name'] for r in sources['ecos_root']['repos']}
      
      if 'topos' in sources and 'repos' in sources['topos']:
          repos['topos'] = {r['full_name'].replace('gerivdb/', '') for r in sources['topos']['repos']}
      
      if 'known_repos' in sources and 'repositories' in sources['known_repos']:
          repos['known_repos'] = {r['name'] for r in sources['known_repos']['repositories']}
      
      # Comparer
      all_names = set()
      for k, v in repos.items():
          all_names.update(v)
      
      for name in sorted(all_names):
          present = {k: name in v for k, v in repos.items()}
          if not all(present.values()):
              missing = [k for k, v in present.items() if not v]
              warnings.append(f'[REGISTRY_DRIFT] Repo \"{name}\" absent de: {missing}')
      
      if warnings:
          for w in warnings: print(w)
          print('[WARN] Drift detecte entre registres')
      else:
          print(f'[OK] Registres coherents: {len(all_names)} repos synchronises')
      
      # Sauvegarder pour rapport
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      report = {
          'step': 'verify-registry-sync',
          'repos_per_source': {k: len(v) for k, v in repos.items()},
          'total_unique': len(all_names),
          'warnings': warnings,
          'timestamp': __import__('datetime').datetime.now().isoformat()
      }
      with open(output_dir / 'step1_registry.json', 'w') as f:
          json.dump(report, f, indent=2)
      "
    on_failure: notify
    timeout_sec: 30

  # -- STEP-2 : Verifier dispatch tables ------------------------------
  - name: verify-dispatch-tables
    description: "STEP-2 - Verifier coherance CTULU PLIX routes <-> TRIX dispatch commands + Piano 243"
    depends_on: [gate-bdcp-awareness]
    command: |
      python -c "
      import json, sys, subprocess, re, os
      from pathlib import Path
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - etape sautee')
          sys.exit(0)
      
      # CTULU: verifier routes via PLIX ternary router
      ctulu_count = 0
      try:
          sys.path.insert(0, 'D:/DO/WEB/TOOLS/L4-TOOLS/CTULU/pipelines/plix-ternary-router')
          from plix_ternary_router import TernaryRouter, TernarySignal, SignalType, TRIT_ADVANCE, TRIT_NEUTRAL
          
          router = TernaryRouter(Path('D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/known_repositories.yaml'))
          ctulu_count = len(router.registry)
          
          test_signal = TernarySignal(
              source=SignalType.IRIS,
              vector=[TRIT_ADVANCE, TRIT_ADVANCE, TRIT_NEUTRAL, TRIT_ADVANCE, TRIT_NEUTRAL],
              confidence=[0.8, 0.7, 0.5, 0.6, 0.4],
              metadata={'target_type': 'auto', 'source_name': 'VERIFICATION'}
          )
          result = router.project(test_signal)
          print(f'[OK] CTULU registry repos: {ctulu_count}')
          print(f'[OK] CTULU projected index: {result.projected_index} ({result.symbol})')
          print(f'[OK] CTULU target repos: {len(result.target_repos)}')
      except Exception as e:
          print(f'[WARN] CTULU routes: {e}')
      
      # TRIX: verifier dispatch commands via dispatch.zig parsing
      trix_count = 0
      try:
          import re
          dispatch_file = Path('D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/src/dispatch.zig')
          if dispatch_file.exists():
              content = dispatch_file.read_text()
              start = content.find('const map = .{')
              if start != -1:
                  brace_count = 0
                  map_content = ''
                  for i, c in enumerate(content[start:]):
                      if c == '{':
                          brace_count += 1
                      elif c == '}':
                          brace_count -= 1
                          if brace_count == 0:
                              map_content = content[start:start+i+1]
                              break
                  commands = re.findall(r'\{\s*\"([^\"]+)\",\s*\.(\w+)', map_content)
                  real_commands = [cmd for cmd in commands if not cmd[1].startswith('EPIC-') and cmd[1] != '/']
                  trix_count = len(real_commands)
                  print(f'[OK] TRIX dispatch commands: {trix_count}')
      except Exception as e:
          print(f'[WARN] TRIX dispatch: {e}')
      
      # Piano 243 verification
      piano_count = 0
      try:
          dispatch_file = Path('D:/DO/WEB/TOOLS/L4-TOOLS/TRIX/src/dispatch.zig')
          if dispatch_file.exists():
              content = dispatch_file.read_text()
              if 'PianoState' in content and 'to_dispatch_index' in content:
                  piano_count = 243
                  print(f'[OK] Piano dispatch model: {piano_count} entries (3^5)')
      except Exception as e:
          print(f'[WARN] Piano dispatch: {e}')
      
      # Verification de coherence
      warnings = []
      if trix_count == 0:
          warnings.append('[DISPATCH_COUNT] TRIX dispatch commands: 0 (expected ~57)')
      if ctulu_count == 0:
          warnings.append('[CTULU_ROUTES] CTULU registry empty')
      if piano_count != 243:
          warnings.append(f'[PIANO] Piano model: {piano_count} (expected 243)')
      
      if warnings:
          for w in warnings: print(w)
      
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      report = {
          'step': 'verify-dispatch-tables',
          'ctulu_registry_count': ctulu_count,
          'trix_commands_count': trix_count,
          'piano_model_count': piano_count,
          'expected_piano': 243,
          'warnings': warnings,
          'timestamp': __import__('datetime').datetime.now().isoformat()
      }
      with open(output_dir / 'step2_dispatch.json', 'w') as f:
          json.dump(report, f, indent=2)
      
      print('[OK] Verification dispatch tables terminee')
      "
    on_failure: notify
    timeout_sec: 60

  # -- STEP-3 : Verifier runtime health -------------------------------
  - name: verify-runtime-health
    description: "STEP-3 - Verifier health endpoints TRIX + ECOS-CLI"
    depends_on: [gate-bdcp-awareness]
    command: |
      python -c "
      import urllib.request, json, sys, time, os
      from pathlib import Path
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - etape sautee')
          sys.exit(0)
      
      health_results = {}
      warnings = []
      
      # TRIX health
      try:
          url = 'http://127.0.0.1:18080/health'
          req = urllib.request.Request(url, method='GET')
          r = urllib.request.urlopen(req, timeout=5)
          trix_health = json.loads(r.read().decode())
          health_results['trix'] = trix_health
          print('[OK] TRIX health: ' + trix_health.get('status', 'unknown'))
      except Exception as e:
          warnings.append('[TRIX_HEALTH] Inaccessible: ' + str(e))
          health_results['trix'] = {'error': str(e)}
      
      # ECOS-CLI health
      try:
          import subprocess
          result = subprocess.run([
              'powershell', '-File', 'C:/DevTools/bin/ecos.ps1', 'health'
          ], capture_output=True, text=True, timeout=30)
          health_results['ecos_cli'] = {
              'returncode': result.returncode,
              'stdout': result.stdout[-500:] if result.stdout else '',
              'stderr': result.stderr[-500:] if result.stderr else ''
          }
          if result.returncode == 0:
              print('[OK] ECOS-CLI health: OK')
          else:
              warnings.append('[ECOS_CLI_HEALTH] Return code: ' + str(result.returncode))
      except Exception as e:
          warnings.append('[ECOS_CLI_HEALTH] Erreur: ' + str(e))
          health_results['ecos_cli'] = {'error': str(e)}
      
      # Gateway Manager health
      try:
          url = 'http://' + os.environ.get('GATEWAY_HOST', '127.0.0.1') + ':' + os.environ.get('GATEWAY_PORT', '18000') + '/health'
          req = urllib.request.Request(url, method='GET')
          r = urllib.request.urlopen(req, timeout=5)
          gateway_health = json.loads(r.read().decode())
          health_results['gateway'] = gateway_health
          print('[OK] Gateway health: ' + gateway_health.get('status', 'unknown'))
      except Exception as e:
          warnings.append('[GATEWAY_HEALTH] Inaccessible: ' + str(e))
      
      if warnings:
          for w in warnings: print(w)
      
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      report = {
          'step': 'verify-runtime-health',
          'health_results': health_results,
          'warnings': warnings,
          'timestamp': __import__('datetime').datetime.now().isoformat()
      }
      with open(output_dir / 'step3_health.json', 'w') as f:
          json.dump(report, f, indent=2)
      
      print('[OK] Verification runtime health terminee')
      "
    on_failure: abort
    timeout_sec: 30

  # -- STEP-4 : Verifier BRIDGES.yaml coherence -----------------------
  - name: verify-bridges-coherence
    description: "STEP-4 - Verifier cohérence BRIDGES.yaml inter-repos"
    depends_on: [gate-bdcp-awareness]
    command: |
      python -c "
      import yaml, sys, os
      from pathlib import Path
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - etape sautee')
          sys.exit(0)
      
      try:
          with open(os.environ.get('BRIDGES_YAML', 'D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/BRIDGES.yaml'), 'r') as f:
              bridges = yaml.safe_load(f)
      except Exception as e:
          print(f'[ERROR] BRIDGES.yaml: {e}')
          sys.exit(1)
      
      if not bridges or 'bridges' not in bridges:
          print('[WARN] BRIDGES.yaml vide ou format invalide')
          sys.exit(0)
      
      bridge_list = bridges['bridges']
      total = len(bridge_list)
      print(f'[OK] {total} bridges definis')
      
      # Verifier que chaque bridge reference des repos existants
      import yaml as yaml2
      with open(os.environ.get('KNOWN_REPOS', 'D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB/known_repositories.yaml'), 'r') as f:
          known = yaml2.safe_load(f)
      known_names = {r['name'] for r in known.get('repositories', [])}
      
      warnings = []
      for bridge in bridge_list:
          source = bridge.get('source', '')
          target = bridge.get('target', '')
          if source and source not in known_names:
              warnings.append(f'[BRIDGE_SOURCE_UNKNOWN] {bridge}: source \"{source}\" pas dans known_repos')
          if target and target not in known_names:
              warnings.append(f'[BRIDGE_TARGET_UNKNOWN] {bridge}: target \"{target}\" pas dans known_repos')
      
      if warnings:
          for w in warnings: print(w)
      
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      report = {
          'step': 'verify-bridges-coherence',
          'total_bridges': total,
          'warnings': warnings,
          'timestamp': __import__('datetime').datetime.now().isoformat()
      }
      with open(output_dir / 'step4_bridges.json', 'w') as f:
          json.dump(report, f, indent=2)
      
      print('[OK] Verification BRIDGES.yaml terminee')
      "
    on_failure: notify
    timeout_sec: 20

  # -- STEP-5 : Verifier WAL integrity --------------------------------
  - name: verify-wal-integrity
    description: "STEP-5 - Verifier integrite WAL sur CTULU, TRIX, ECOS-CLI, GOVERNANCE-HUB"
    depends_on: [gate-bdcp-awareness]
    command: |
      python -c "
      import subprocess, sys, json, os
      from pathlib import Path
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - etape sautee')
          sys.exit(0)
      
      repos = [
          ('CTULU', os.environ.get('CTULU_PATH', 'D:/DO/WEB/TOOLS/L4-TOOLS/CTULU')),
          ('TRIX', os.environ.get('TRIX_PATH', 'D:/DO/WEB/TOOLS/L4-TOOLS/TRIX')),
          ('ECOS-CLI', os.environ.get('ECOS_CLI_PATH', 'D:/DO/WEB/TOOLS/L1-INFRA/ECOS-CLI')),
          ('GOVERNANCE-HUB', os.environ.get('GOVERNANCE_HUB', 'D:/DO/WEB/TOOLS/L0-CANON/GOVERNANCE-HUB'))
      ]
      
      results = {}
      warnings = []
      errors = []
      
      for name, path in repos:
          try:
              result = subprocess.run([
                  'python', '-m', 'kiva_cli.kiva', 'wal', 'verify'
              ], capture_output=True, text=True, cwd=path, timeout=60)
              
              results[name] = {
                  'returncode': result.returncode,
                  'stdout': result.stdout[-200:] if result.stdout else '',
                  'stderr': result.stderr[-200:] if result.stderr else ''
              }
              
              if result.returncode == 0:
                  print(f'[OK] {name} WAL: verified')
              else:
                  warnings.append(f'{name} WAL verify returned {result.returncode}')
          except Exception as e:
              errors.append(f'{name} WAL error: {e}')
              results[name] = {'error': str(e)}
      
      if errors:
          for e in errors: print(f'[ERROR] {e}')
          sys.exit(1)
      
      if warnings:
          for w in warnings: print(f'[WARN] {w}')
      
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      report = {
          'step': 'verify-wal-integrity',
          'results': results,
          'warnings': warnings,
          'timestamp': __import__('datetime').datetime.now().isoformat()
      }
      with open(output_dir / 'step5_wal.json', 'w') as f:
          json.dump(report, f, indent=2)
      
      print('[OK] Verification WAL integrity terminee')
      "
    on_failure: notify
    timeout_sec: 120

  # -- STEP-6 : Generer rapport global --------------------------------
  - name: generate-orchestration-report
    description: "STEP-6 - Generation rapport global orchestration"
    depends_on: [verify-registry-sync, verify-dispatch-tables, verify-runtime-health, verify-bridges-coherence, verify-wal-integrity]
    command: |
      python -c "
      import json
      import os
      from pathlib import Path
      from datetime import datetime
      
      # Verifier flag BDCP skip
      skip_flag = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / 'bdcp_skip.flag'
      if skip_flag.exists() and skip_flag.read_text().strip() == 'true':
          print('[SKIP] BDCP mode actif - rapport minimal')
          report = {
              'pipeline': 'ecosystem-orchestration-pipeline',
              'timestamp': datetime.now().isoformat(),
              'status': 'skipped_bdcp',
              'reason': 'BDCP mode active - pipeline skipped per ADR-2026-07-28-020'
          }
      else:
          # Agreger tous les rapports d'etapes
          steps = ['step1_registry.json', 'step2_dispatch.json', 'step3_health.json', 'step4_bridges.json', 'step5_wal.json']
          aggregated = {}
          all_warnings = []
          
          for step_file in steps:
              f = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration')) / step_file
              if f.exists():
                  data = json.loads(f.read_text())
                  step_name = data.get('step', step_file)
                  aggregated[step_name] = data
                  if 'warnings' in data:
                      all_warnings.extend(data['warnings'])
          
          report = {
              'pipeline': 'ecosystem-orchestration-pipeline',
              'timestamp': datetime.now().isoformat(),
              'checks_performed': list(aggregated.keys()),
              'steps': aggregated,
              'total_warnings': len(all_warnings),
              'status': 'completed' if len(all_warnings) == 0 else 'completed_with_warnings'
          }
      
      output_dir = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      output_dir.mkdir(parents=True, exist_ok=True)
      timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
      report_file = output_dir / f'ecosystem_orchestration_{timestamp}.json'
      with open(report_file, 'w') as f:
          json.dump(report, f, indent=2)
      
      # Symlink latest
      latest = output_dir / 'ecosystem_orchestration-latest.json'
      if latest.exists() or latest.is_symlink():
          latest.unlink()
      latest.symlink_to(report_file.name)
      
      total_warn = report['total_warnings']
      print('[OK] Rapport global genere: ' + str(report_file))
      print('[OK] Status: ' + report['status'])
      if 'total_warnings' in report:
          print('[INFO] Total warnings: ' + str(total_warn))
      "
    on_failure: warn
    timeout_sec: 15

  # -- ARCHIVE : Organisation par date ---------------------------------
  - name: archive-reports
    description: "Archive - Organisation par date YYYY-MM-DD/"
    depends_on: [generate-orchestration-report]
    command: |
      python -c "
      import shutil
      import os
      from pathlib import Path
      from datetime import datetime
      
      src = Path(os.environ.get('OUTPUT_DIR', 'D:/DO/WEB/TOOLS/reports/ecosystem-orchestration'))
      dest = src / datetime.now().strftime('%Y-%m-%d')
      dest.mkdir(parents=True, exist_ok=True)
      
      moved = 0
      for f in src.glob('*.json'):
          if not f.name.endswith('-latest.json'):
              shutil.move(str(f), dest / f.name)
              moved += 1
      
      # Nettoyer flag BDCP
      flag = src / 'bdcp_skip.flag'
      if flag.exists():
          flag.unlink()
      
      print(f'[OK] {moved} fichier(s) archive(s) -> {dest}')
      "
    on_failure: warn
    timeout_sec: 10

