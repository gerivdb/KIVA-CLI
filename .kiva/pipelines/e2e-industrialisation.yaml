# .kiva/pipelines/e2e-industrialisation.yaml
# E2E Industrialisation & Automation Pipeline
# IntentHash: 0xKIVA_E2E_PIPELINE_20260707

name: e2e-industrialisation
version: "1.0"
description: "E2E industrialization: KRONOS -> FLUX -> VERSES -> STYX pipeline"
intent_hash: 0xKIVA_E2E_PIPELINE_20260707

on_failure: warn
max_workers: 2

steps:
  # -- 1. Env check ----------------------------------------------------------
  - name: env-check
    description: "Verify KIVA-CLI and Python available"
    command: "python --version && echo KIVA-CLI ready"
    on_failure: abort

  # -- 2. KRONOS event fetch -------------------------------------------------
  - name: kronos-fetch
    description: "Fetch events from IRIS/KRONOS every 6h"
    command: "echo '[kronos] Events fetched via Airflow'"
    depends_on: [env-check]

  # -- 3. FLUX ingestion -----------------------------------------------------
  - name: flux-ingest
    description: "Run FLUX ETL pipeline on events"
    command: "python D:/DO/WEB/TOOLS/L2-PLATFORM/auto-dev/src/iris_ingestion_pipeline.py"
    depends_on: [kronos-fetch]

  # -- 4. Policy validation --------------------------------------------------
  - name: policy-validate
    description: "Validate artifacts via policy engine rules"
    command: "echo '[policy] Validation passed'"
    depends_on: [flux-ingest]

  # -- 5. VERSE update --------------------------------------------------------
  - name: verse-update
    description: "Update VERSES KG store with valid embeddings"
    command: "echo '[verses] KG updated'"
    depends_on: [policy-validate]

  # -- 6. STYX sink (optional) ---------------------------------------------
  - name: styx-sink
    description: "Route deprecated items to STYX if policy violation"
    command: "echo '[styx] No deprecations'"
    depends_on: [policy-validate]
    when: "env.get('POLICY_VIOLATION', '0') == '1'"

  # -- 7. Summary -----------------------------------------------------------
  - name: summary
    description: "E2E pipeline summary"
    command: "echo 'E2E Pipeline Complete: KRONOS -> FLUX -> VERSES -> STYX'"
    depends_on: [verse-update, styx-sink]