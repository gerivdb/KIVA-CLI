# .kiva/pipelines/trix-zig-guard.yaml
# Pipeline CI local TRIX — CTULU Zig Guard
# Remplace le GitHub Actions workflow (pas de runner self-hosté)
# Tourne sur ENV2 (Z600) via KIVA-CLI
#
# Usage:
#   kiva pipeline run trix-zig-guard
#   kiva pipeline run trix-zig-guard --dry-run
#   kiva pipeline validate trix-zig-guard

name: trix-zig-guard
version: "1.1.0"
description: "CTULU Zig Guard — Build trix.exe + trixd.exe + guards check sur ENV2"
intent_hash: 0xKIVA_TRIX_ZIG_GUARD_20260621
nexus_status: ACTIVE
on_failure: abort
max_workers: 1

steps:

  # -- 1. Preflight ---------------------------------------------------------------
  - name: preflight
    description: "Vérifie que Zig et le repo TRIX sont accessibles"
    command: |
      C:\DevTools\bin\zig\zig.exe version
    on_failure: abort
    retry: 0

  # -- 2. Build trix.exe ----------------------------------------------------------
  - name: build-trix
    description: "Build trix.exe (--release=fast, Westmere)"
    command: |
      cd /d D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX
      C:\DevTools\bin\zig\zig.exe build build-trix --release=fast
    depends_on: [preflight]
    on_failure: abort
    retry: 0

  # -- 3. Build trixd.exe ---------------------------------------------------------
  - name: build-trixd
    description: "Build trixd.exe (--release=fast, Westmere)"
    command: |
      cd /d D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX
      C:\DevTools\bin\zig\zig.exe build install --release=fast
    depends_on: [preflight]
    on_failure: abort
    retry: 0

  # -- 4. Verify binaries ---------------------------------------------------------
  - name: verify-binaries
    description: "Vérifie que trix.exe et trixd.exe existent"
    command: |
      if not exist D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\zig-out\bin\trix.exe (echo FAIL: trix.exe manquant && exit 1)
      if not exist D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\zig-out\bin\trixd.exe (echo FAIL: trixd.exe manquant && exit 1)
      echo OK: trix.exe + trixd.exe presents
    depends_on: [build-trix, build-trixd]
    on_failure: abort
    retry: 0

  # -- 5. CTULU guards check -----------------------------------------------------
  - name: ctulu-guards
    description: "Vérifie zig_shims.zig + comptime_guards.zig"
    command: |
      if not exist D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\src\zig_shims.zig (echo FAIL: zig_shims.zig manquant && exit 1)
      if not exist D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\src\comptime_guards.zig (echo FAIL: comptime_guards.zig manquant && exit 1)
      echo OK: CTULU guards presents
    depends_on: [preflight]
    on_failure: abort
    retry: 0

  # -- 6. Zig tests ---------------------------------------------------------------
  - name: zig-tests
    description: "Lance les tests Zig"
    command: |
      cd /d D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX
      C:\DevTools\bin\zig\zig.exe build test
    depends_on: [build-trix, build-trixd]
    on_failure: notify
    retry: 0

  # -- 7. Rapport WAL si échec ---------------------------------------------------
  - name: wal-report
    description: "Genere un rapport WAL en cas d'echec"
    command: |
      if not exist D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\REPORTS mkdir D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\REPORTS
      echo {"date":"%DATE%","target":"gerivdb/TRIX","event":"trix_zig_guard_failure","status":"PENDING_CTULU_RESOLUTION","notify":"HITL"} > D:\DO\WEB\TOOLS\L2-PLATFORM\TRIX\REPORTS\wal-zig-guard-%DATE%.json
      echo WAL: Rapport genere
    depends_on: [verify-binaries, ctulu-guards, zig-tests]
    on_failure: warn
    retry: 0
