# .kiva/pipelines/mc-rnn-ci.yaml
# MC-RNN Cross-Repo CI Pipeline — local CI for all 6 MC-RNN repos
#
# Usage:
#   kiva pipeline show mc-rnn-ci
#   kiva pipeline run mc-rnn-ci --dry-run
#   kiva pipeline run mc-rnn-ci --verbose
#   kiva pipeline validate mc-rnn-ci
#
# Pre-requisites:
#   - Python 3.10+ with pytest (LYCOS, BRAIN, TINA)
#   - Zig 0.14+ (CodeDB-E5620)
#   - git (all repos)
#
# Gate: D4+ (post-branch, pre-merge). Run before creating PRs.
# Update 2026-06-07: ajout step registry-audit (remede L7), correction path CodeDB-E5620

name: mc-rnn-ci
version: "1.1"
description: "MC-RNN local CI — tests for all 6 repos before PR merge"
intent_hash: 0xMC_RNN_CI_PIPELINE_20260607

# Fail fast on test errors, but continue on lint/coverage warnings
on_failure: abort
max_workers: 3

# Parallel groups: lint + tests can run concurrently per repo
parallel_groups:
  - [lycos-lint, codedb-bench]

# ---------------------------------------------------------------------------
# Steps
# ---------------------------------------------------------------------------
steps:

  # -- 1. Repo discovery ------------------------------------------------------
  # Verify all MC-RNN repos exist locally
  - name: repo-discovery
    description: "Verify all 6 MC-RNN repos are reachable locally"
    command: "python -c \"import os; repos = {'LYCOS': r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\LYCOS', 'CodeDB-E5620': r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\CodeDB-E5620', 'VDB': r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VDB'}; [print(f'  {k}: {\"OK\" if os.path.isdir(v) else \"NOT FOUND\"}' ) for k,v in repos.items()]\""
    on_failure: abort
    retry: 0

  # -- 2. LYCOS lint (parallel with codedb-bench) ------------------------------
  - name: lycos-lint
    description: "Flake8 on LYCOS src/ (PEP8)"
    command: python -m flake8 "D:\DO\WEB\TOOLS\L4-TOOLS\LYCOS\src" --max-line-length=120 --count --statistics
    depends_on: [repo-discovery]
    on_failure: warn
    retry: 0
    when: "env.get('SKIP_LINT', '0') != '1'"

  # -- 3. CodeDB-E5620 Zig test + bench (parallel with lycos-lint) -------------
  - name: codedb-bench
    description: "Zig build test + bench for CodeDB-E5620"
    command: "cd /d D:\DO\WEB\TOOLS\L4-TOOLS\CodeDB-E5620 && zig build test --summary all 2>&1 && zig build mc-rnn-bench 2>&1"
    depends_on: [repo-discovery]
    on_failure: abort
    retry: 0
    when: "env.get('SKIP_ZIG', '0') != '1'"

  # -- 4. LYCOS unit tests (pytest) -------------------------------------------
  - name: lycos-tests
    description: "pytest on LYCOS tests/ (test_lycos_mc.py + test_fluence_encoder.py + test_janus_compressor.py)"
    command: python -m pytest "D:\DO\WEB\TOOLS\L4-TOOLS\LYCOS\tests" -v --tb=short -x --ignore="D:\DO\WEB\TOOLS\L4-TOOLS\LYCOS\tests\test_integration.py"
    depends_on: [lycos-lint]
    on_failure: abort
    retry: 1
    when: "last_status in ('SUCCESS', 'WARN') and not dry_run"

  # -- 5. VDB schema validation -----------------------------------------------
  - name: vdb-schema-validate
    description: "Validate mc_hidden_states.yaml schema (YAML parse + field check)"
    command: "python -c \"import yaml; data = yaml.safe_load(open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VDB\\schema\\mc_hidden_states.yaml', encoding='utf-8')); schema_key = [k for k in data if 'mc_hidden' in str(k)][0]; fields = data[schema_key]['fields']; names = [f['name'] for f in fields]; assert all(f in names for f in ['h_vector','source_layer','gate_activity','symbol_hash']); print(f'  Schema OK: {len(fields)} fields')\""
    depends_on: [repo-discovery]
    on_failure: abort
    retry: 0

  # -- 6. VDB fingerprint SQL validation --------------------------------------
  - name: vdb-sql-validate
    description: "Validate diffscope_fingerprints.sql is parseable (SQLite syntax check)"
    command: "python -c \"import sqlite3; conn = sqlite3.connect(':memory:'); sql = open(r'D:\\DO\\WEB\\TOOLS\\L4-TOOLS\\VDB\\schema\\diffscope_fingerprints.sql', encoding='utf-8').read(); conn.executescript(sql); print(f'  SQL OK: {len(sql.splitlines())} lines'); conn.close()\""
    depends_on: [repo-discovery]
    on_failure: abort
    retry: 0

  # -- 7. Coverage (LYCOS only — represents FLUENCE coverage) -----------------
  - name: lycos-coverage
    description: "pytest --cov on LYCOS (FLUENCE encoding + MC-RNN cache)"
    command: python -m pytest "D:\DO\WEB\TOOLS\L4-TOOLS\LYCOS\tests" --cov="D:\DO\WEB\TOOLS\L4-TOOLS\LYCOS\src" --cov-report=term-missing --cov-fail-under=70 -q
    depends_on: [lycos-tests]
    on_failure: notify
    retry: 0
    when: "last_status == 'SUCCESS' or last_status == 'WARN'"

  # -- 8. Summary -------------------------------------------------------------
  - name: summary
    description: "Print CI summary"
    command: "python -c \"print('\\n=== MC-RNN CI SUMMARY ==='); print('Repos tested: LYCOS (pytest), CodeDB-E5620 (zig test+bench), VDB (schema+SQL)'); print('Repos NOT tested locally (need clone): BRAIN, TINA, UAE')\""
    depends_on: [lycos-coverage, codedb-bench, vdb-schema-validate, vdb-sql-validate]
    on_failure: warn
    retry: 0

  # -- 9. Registry audit (post-merge) -----------------------------------------
  # Verifie que known_repositories.yaml est coherent avec la realite GitHub
  - name: registry-audit
    description: "Verify known_repositories.yaml matches GitHub reality (no phantom repos)"
    command: "python -c \"import yaml, sys; data = yaml.safe_load(open(r'D:\\DO\\WEB\\TOOLS\\L0-CANON\\GOVERNANCE-HUB\\known_repositories.yaml', encoding='utf-8')); repos = data.get('repositories', []); phantom = [r for r in repos if r.get('status') != 'deprecated' and not r.get('url','').startswith('https://github.com/gerivdb/')]; print(f'  Total repos: {len(repos)}'); print(f'  Active: {len([r for r in repos if r.get(\"status\") == \"active\"])}'); print(f'  Phantom: {len(phantom)}'); [print(f'    PHANTOM: {r[\"name\"]} ({r.get(\"full_name\",\"\")})') for r in phantom]\""
    depends_on: [summary]
    on_failure: warn  # Non-bloquant : informe mais n'arrete pas le pipeline
    retry: 0
    when: "env.get('SKIP_REGISTRY_AUDIT', '0') != '1'"
