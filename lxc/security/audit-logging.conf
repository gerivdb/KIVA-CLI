# LXC Audit Logging Configuration
# Generated by KIVA-CLI Phase 5 Batch 3/3
# Mode: H0 Autonomous Base-3 Ternary
# IntentHash: 0x6F8E3D2A9C5B1E4A-F11468A80A92-AUDIT-LOG

# Global audit settings
audit_enabled: true
log_level: INFO
log_format: json
log_rotation: daily
log_retention_days: 90

# Log destinations
destinations:
  - type: file
    path: /var/log/lxc/audit/containers.log
    max_size_mb: 100
    max_files: 30
  
  - type: syslog
    facility: local7
    tag: lxc-audit
  
  - type: remote
    protocol: tcp
    host: logging.ecosystem.local
    port: 5140
    tls: true

# Events to audit
audit_events:
  container_lifecycle:
    - start
    - stop
    - restart
    - freeze
    - unfreeze
    - destroy
    
  container_config:
    - config_change
    - limit_change
    - network_change
    
  container_access:
    - console_access
    - exec_command
    - file_access
    
  security_events:
    - apparmor_violation
    - seccomp_violation
    - capability_denied
    - network_blocked
    
  resource_events:
    - cpu_threshold_exceeded
    - memory_threshold_exceeded
    - io_threshold_exceeded
    - disk_quota_exceeded

# Container-specific settings
containers:
  kiva-cli:
    audit_level: detailed
    sensitive_paths:
      - /root/.ssh
      - /etc/secrets
      - /var/lib/kiva/wal
    
  brain:
    audit_level: detailed
    sensitive_paths:
      - /data/models
      - /data/knowledge-graph
      - /var/lib/brain/db
  
  fluence:
    audit_level: detailed
    sensitive_paths:
      - /app/config
      - /data/frameworks
  
  default:
    audit_level: standard
    sensitive_paths:
      - /root/.ssh
      - /etc/secrets

# Alerting rules
alerts:
  - name: Multiple Failed Access Attempts
    condition: failed_access_count > 5 in 5m
    severity: high
    action: email,slack
    
  - name: Unauthorized Root Access
    condition: user != authorized_user AND command contains sudo
    severity: critical
    action: email,slack,block
    
  - name: Sensitive File Access
    condition: path in sensitive_paths AND user != system
    severity: medium
    action: log,email
    
  - name: Resource Limit Exceeded
    condition: resource_usage > 90%
    severity: medium
    action: log,email

# Compliance settings
compliance:
  enabled: true
  standards:
    - PCI-DSS
    - GDPR
    - SOC2
  
  retention_policy:
    audit_logs: 365 days
    security_logs: 730 days
    compliance_reports: 2555 days  # 7 years
