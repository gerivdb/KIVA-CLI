name: RSS-v2 Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rss-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run RSS-v2 linter
        run: python rss_lint.py --repo . --all-checks --check-artifacts
