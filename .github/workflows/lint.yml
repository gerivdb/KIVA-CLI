name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy isort
      
      - name: Run Black (code formatting)
        run: |
          black --check --line-length 100 kiva_cli/
      
      - name: Run isort (import sorting)
        run: |
          isort --check-only --profile black kiva_cli/
      
      - name: Run flake8 (PEP 8 compliance)
        run: |
          flake8 kiva_cli/ --max-line-length=100 --extend-ignore=E203,W503
      
      - name: Run mypy (type checking)
        run: |
          mypy kiva_cli/ --ignore-missing-imports --strict-optional
