name: Deploy to FLUENCE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Build distribution
        run: |
          pip install build
          python -m build
      
      - name: Deploy to environment
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          echo "Deploying KIVA-CLI to $DEPLOY_ENV"
          # FLUENCE CLI integration (if available)
          if command -v fluence &> /dev/null; then
            fluence deploy ./dist/*.whl --env $DEPLOY_ENV --strategy rolling
          else
            echo "FLUENCE CLI not found, skipping deployment orchestration"
          fi
      
      - name: Create deployment record
        run: |
          python << 'EOF'
          import json
          from datetime import datetime
          
          record = {
              "version": "${{ github.ref_name }}",
              "environment": "${{ github.event.inputs.environment || 'dev' }}",
              "timestamp": datetime.now().isoformat(),
              "commit_sha": "${{ github.sha }}",
              "status": "SUCCESS"
          }
          
          with open('deployment_record.json', 'w') as f:
              json.dump(record, f, indent=2)
          EOF
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record
          path: deployment_record.json
