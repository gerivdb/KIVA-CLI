name: Ecosystem Cross-Repo Sync + Governance Enforcement

on:
  schedule:
    # Run daily at 02:00 UTC (sync), 02:15 UTC (forks), 02:30 UTC (dashboard)
    - cron: '0 2 * * *'
    - cron: '15 2 * * *'
    - cron: '30 2 * * *'
  
  push:
    branches:
      - main
    paths:
      - 'ECOS_ROOT.json'
      - 'scripts/cross_repo_sync.py'
      - 'scripts/sync_fork_upstream.py'
      - 'scripts/bootstrap_repo.py'
      - 'scripts/deploy_templates.py'
      - 'scripts/configure_branch_protection.py'
      - 'scripts/verify_constitutional_ci.py'
      - 'scripts/conformance_dashboard.py'
      - 'scripts/deploy_hooks.py'
      - '.github/workflows/ecosystem_sync.yml'
  
  workflow_dispatch:
    inputs:
      operation:
        description: 'Sync operation to perform'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - validate
          - bootstrap
          - sync-forks
          - enforce
          - deploy-templates
          - deploy-hooks
          - configure-protection
          - dashboard
      target_repos:
        description: 'Target repositories (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      force_enforcement:
        description: 'Force enforcement on external forks (HITL)'
        required: false
        default: 'false'
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Job 0: Prepare
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      active_repos: ${{ steps.filter_repos.outputs.active_repos }}
      operation: ${{ steps.set_operation.outputs.operation }}
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB (for known_repositories.yaml)
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Set operation
        id: set_operation
        run: |
          OP="${{ github.event.inputs.operation || 'full' }}"
          echo "operation=$OP" >> $GITHUB_OUTPUT
      
      - name: Filter active repos with enforcement_mode
        id: filter_repos
        run: |
          python -c "
import yaml, json, sys
with open('GOVERNANCE-HUB/known_repositories.yaml') as f:
    data = yaml.safe_load(f)

active = []
for tier in ['P0_REPOS', 'P1_REPOS', 'P2_REPOS', 'P3_REPOS']:
    for repo in data.get(tier, []):
        if repo.get('status') == 'ACTIVE' and repo.get('local_path'):
            em = repo.get('enforcement_mode', {})
            if em.get('ci') != 'none':
                active.append(repo['full_name'])
print(json.dumps(active))
" > active_repos.json
          echo "active_repos=$(cat active_repos.json)" >> $GITHUB_OUTPUT

  # Job 1: Deploy Workflow Templates
  deploy-templates:
    name: Deploy Governance Templates
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'validate') || contains(needs.prepare.outputs.operation, 'deploy-templates') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Deploy Workflow Templates
        run: |
          python scripts/deploy_templates.py \
            --source REPO-STANDARDS/.github/workflows \
            --target-repos "${{ needs.prepare.outputs.active_repos }}" \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Deploy Hooks
  deploy-hooks:
    name: Deploy Git Hooks
    needs: [prepare, deploy-templates]
    if: contains(needs.prepare.outputs.operation, 'validate') || contains(needs.prepare.outputs.operation, 'deploy-hooks') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Deploy Hooks
        run: |
          python scripts/deploy_hooks.py \
            --source REPO-STANDARDS/.githooks \
            --target-repos "${{ needs.prepare.outputs.active_repos }}" \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Generate BRGS rules.sh
  generate-brgs-rules:
    name: Generate BRGS rules.sh
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'validate') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate BRGS rules.sh
        run: |
          python GOVERNANCE-HUB/scripts/generate_rules.py \
            --governance GOVERNANCE-HUB/multi-repo-governance.yaml \
            --output .githooks/rules.sh
      
      - name: Deploy rules.sh to repos
        run: |
          python scripts/deploy_hooks.py \
            --source .githooks/rules.sh \
            --target-repos "${{ needs.prepare.outputs.active_repos }}" \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Configure Branch Protection
  configure-protection:
    name: Configure Branch Protection
    needs: [prepare, deploy-templates]
    if: contains(needs.prepare.outputs.operation, 'validate') || contains(needs.prepare.outputs.operation, 'configure-protection') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Wait for Status Checks
        run: |
          python scripts/wait_for_checks.py \
            --repos "${{ needs.prepare.outputs.active_repos }}" \
            --checks "RSS-v2 Linter,BRGS -- Branch Ownership Check,BRANCH-GOVERNOR -- Branch Naming Check,VYOA Verify" \
            --timeout 300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Branch Protection
        run: |
          python scripts/configure_branch_protection.py \
            --repos "${{ needs.prepare.outputs.active_repos }}" \
            --checks "RSS-v2 Linter,BRGS -- Branch Ownership Check,BRANCH-GOVERNOR -- Branch Naming Check,VYOA Verify" \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Sync Fork Upstreams
  sync-forks:
    name: Sync Fork Upstreams
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'sync-forks') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Sync Fork Upstreams
        run: |
          python scripts/sync_fork_upstream.py \
            --config GOVERNANCE-HUB/known_repositories.yaml \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Fork Sync Report
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-report-${{ github.run_number }}
          path: fork-sync-report.json
          retention-days: 30

  # Job 6: Bootstrap New Repos
  bootstrap:
    name: Bootstrap New ACTIVE Repos
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'bootstrap')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Bootstrap Target Repo
        run: |
          python scripts/bootstrap_repo.py \
            --repo "${{ github.event.inputs.target_repos }}" \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Constitutional CI Enforcement
  enforce-constitutional-ci:
    name: Enforce Constitutional CI
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'enforce') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Verify Constitutional CI
        run: |
          python scripts/verify_constitutional_ci.py \
            --config GOVERNANCE-HUB/known_repositories.yaml \
            --token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 8: Conformance Dashboard
  dashboard:
    name: Generate Conformance Dashboard
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'dashboard') || contains(needs.prepare.outputs.operation, 'full') || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout GOVERNANCE-HUB
        uses: actions/checkout@v4
        with:
          repository: gerivdb/GOVERNANCE-HUB
          path: GOVERNANCE-HUB
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate Dashboard
        run: |
          python scripts/conformance_dashboard.py \
            --config GOVERNANCE-HUB/known_repositories.yaml \
            --output conformance-${{ github.run_number }}.md
      
      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: conformance-dashboard-${{ github.run_number }}
          path: conformance-*.md
          retention-days: 90
      
      - name: Commit Dashboard to GOVERNANCE-HUB
        run: |
          cp conformance-*.md ../GOVERNANCE-HUB/reports/
          cd ../GOVERNANCE-HUB
          git config user.name "ECOS-AUTO"
          git config user.email "ecos-auto@ecosystem-1.dev"
          git add reports/conformance-*.md
          git commit -m "report(conformance): daily dashboard ${{ github.run_number }}" || true
          git push origin main || true

  # Job 9: Legacy Cross-Repo Sync (ECOYSTEM/DevTools)
  legacy-sync:
    name: Legacy Cross-Repo Sync
    needs: prepare
    if: contains(needs.prepare.outputs.operation, 'legacy') || contains(needs.prepare.outputs.operation, 'full')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KIVA-CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout ECOYSTEM
        uses: actions/checkout@v4
        with:
          repository: gerivdb/ECOYSTEM
          path: ../ECOYSTEM
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout DevTools
        uses: actions/checkout@v4
        with:
          repository: gerivdb/DevTools
          path: ../DevTools
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Run Legacy Cross-Repo Sync
        id: sync
        run: |
          OPERATION="${{ github.event.inputs.operation || 'full' }}"
          TARGET_REPOS="${{ github.event.inputs.target_repos || 'all' }}"
          
          python scripts/cross_repo_sync.py \
            --root .. \
            --source KIVA-CLI \
            --operation "$OPERATION" \
            --output sync_report.md
          
          if [ -f "sync_report.md" ]; then
            echo "sync_success=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes to ECOYSTEM
        if: steps.sync.outputs.sync_success == 'true'
        run: |
          cd ../ECOYSTEM
          git config user.name "ECOS-AUTO"
          git config user.email "ecos-auto@ecosystem-1.dev"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "[ECOS-AUTO] Sync from KIVA-CLI via GitHub Actions
            
            IntentHash: 0x9C7E4D2A8F5B1E3A-ACTIONS-SYNC
            Workflow: ecosystem_sync.yml"
            git push
          else
            echo "No changes to commit in ECOYSTEM"
          fi

      - name: Upload sync report
        if: steps.sync.outputs.sync_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_number }}
          path: sync_report.md
          retention-days: 30