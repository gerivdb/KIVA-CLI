name: Base-5 Fire-and-Forget Pipeline

on:
  issues:
    types: [labeled]

jobs:
  base5-generate:
    name: Base-5 L27 Generation
    runs-on: self-hosted
    container: gerivdb/kiva-runner:latest
    environment: env2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests pygithub

      - name: 🔥 Base-5 Fire-and-Forget Generation
        run: |
          python tools/pipeline/base5_webhook_handler.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV: ENV2

      - name: ✅ Post results
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Base-5 L27 Fire-and-Forget génération terminée. PR créé automatiquement."
            })
