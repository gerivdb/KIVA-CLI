name: Branch Gate

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action — Branch Routing & Governance System (BRGS) L4
# Reusable workflow for branch governance checks
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "renovate/**"
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  ownership-check:
    name: "BRGS — Branch Ownership Check"
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check branch ownership
        id: check
        env:
          GOVERNANCE_HUB_PATH: ${{ secrets.GOVERNANCE_HUB_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: python .github/scripts/check_ownership.py

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "✅ BRGS check passed"
          else
            echo "⚠️  BRGS check found violations (see annotations above)"
          fi

  branch-naming:
    name: "BRANCH-GOVERNOR — Branch Naming Check"
    runs-on: ubuntu-latest
    needs: ownership-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check branch naming convention
        id: naming
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          PATTERN="^(feat|fix|docs|chore|refactor|perf|test|hotfix|emergency|experiment)/[a-z0-9-]+-[0-9]{3}$"

          if echo "$BRANCH_NAME" | grep -qE "$PATTERN"; then
            echo "✅ Branch name '$BRANCH_NAME' conforms to BRANCH-CHECK.yaml"
            echo "result=pass" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "develop" ]; then
            echo "ℹ️  Branch name '$BRANCH_NAME' is a trunk branch — skipping"
            echo "result=skip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Branch name '$BRANCH_NAME' violates BRANCH-CHECK.yaml pattern"
            echo "::warning::Expected: type/slug-id (e.g. feat/add-feature-001)"
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi